name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Require clean main release source
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git status --porcelain --untracked-files=no)"

      - id: meta
        run: |
          node <<'NODE'
          const fs = require("fs");
          const tag = process.env.GITHUB_REF_NAME;
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const version = pkg.version;

          if (tag !== `v${version}`) {
            console.error(`Tag ${tag} must match package.json version ${version}.`);
            process.exit(1);
          }

          let npmTag = "latest";
          let prerelease = "false";
          if (/-beta\.\d+$/.test(version)) {
            npmTag = "beta";
            prerelease = "true";
          } else if (/-rc\.\d+$/.test(version)) {
            npmTag = "rc";
            prerelease = "true";
          } else if (/-/.test(version)) {
            console.error("Only beta.N and rc.N prerelease versions are supported.");
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `npm_tag=${npmTag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${prerelease}\n`);
          NODE

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test scripts/release-workflows.test.js

      - run: python3 -B scripts/test-release-npm-artifact.py

      - run: bun run test

      - run: bun ./bin/koubo-clip --help

      - name: Build canonical npm package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          KOUBO_CLIP_SOURCE_REVISION: ${{ github.sha }}
        run: bun run package:npm "dist/koubo-clip-${VERSION}.tgz"

      - name: Verify installed canonical npm package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: bun run verify:package:npm "dist/koubo-clip-${VERSION}.tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: koubo-clip-${{ steps.meta.outputs.version }}-canonical-npm
          path: |
            dist/koubo-clip-${{ steps.meta.outputs.version }}.tgz
            dist/koubo-clip-${{ steps.meta.outputs.version }}.tgz.json
            dist/koubo-clip-${{ steps.meta.outputs.version }}.tgz.acceptance.json

  box-macos-aarch64:
    needs: validate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Prepare verified corresponding-source cache
        env:
          KOUBO_FFMPEG_SOURCE_CACHE: ${{ runner.temp }}/koubo-ffmpeg-source-cache
        run: |
          python3 scripts/prepare-ffmpeg-source-cache.py
          echo "KOUBO_FFMPEG_SOURCE_CACHE=$KOUBO_FFMPEG_SOURCE_CACHE" >> "$GITHUB_ENV"

      - name: Build audited FFmpeg runtime and corresponding-source bundle
        env:
          KOUBO_CLIP_SOURCE_REVISION: ${{ github.sha }}
        run: bun run build:box-ffmpeg-runtime

      - name: Prepare pinned Chrome Headless Shell
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/koubo-box-browser"
          npx @puppeteer/browsers@2.13.2 install chrome-headless-shell@131.0.6778.85 --platform mac_arm --path "$cache"
          browser_root="$cache/chrome-headless-shell/mac_arm-131.0.6778.85/chrome-headless-shell-mac-arm64"
          test -x "$browser_root/chrome-headless-shell"
          echo "KOUBO_BOX_BROWSER_ROOT=$browser_root" >> "$GITHUB_ENV"

      - name: Build Box CLI and Skill packages
        env:
          KOUBO_CLIP_SOURCE_REVISION: ${{ github.sha }}
          KOUBO_BOX_TARGET: macos-aarch64
          KOUBO_BOX_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: bun run package:box

      - name: Verify Box packages from arbitrary cwd
        run: bun run verify:package:box

      - name: Enforce the committed FFmpeg redistribution gate
        env:
          BOX_RELEASE_GATE_OUTPUT: dist/box/ffmpeg-license-gate-${{ needs.validate.outputs.version }}.json
        run: bun run verify:box-release-gate --release

      - name: Verify Box delivery source revision
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tar -xOf "dist/box/koubo-clip-box-cli-${VERSION}-macos-aarch64.tgz" "koubo-clip-box-cli-${VERSION}-macos-aarch64/delivery-manifest.json" > "$RUNNER_TEMP/box-delivery-manifest.json"
          node <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/box-delivery-manifest.json`, "utf8"));
          if (manifest.source_revision !== process.env.EXPECTED_SOURCE_REVISION) {
            throw new Error(`Box delivery source_revision mismatch: ${manifest.source_revision}`);
          }
          if (manifest.distribution_kind !== "box-cli") {
            throw new Error(`Box delivery distribution_kind mismatch: ${manifest.distribution_kind}`);
          }
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: koubo-clip-${{ needs.validate.outputs.version }}-box-macos-aarch64
          path: |
            dist/box/koubo-clip-box-cli-${{ needs.validate.outputs.version }}-macos-aarch64.tgz
            dist/box/koubo-clip-box-cli-${{ needs.validate.outputs.version }}-macos-aarch64.tgz.acceptance.json
            dist/box/koubo-clip-box-skill-${{ needs.validate.outputs.version }}.tgz
            dist/box/cli-package.box.json
            dist/box/skill.box.json
            dist/box/koubo-clip-box-${{ needs.validate.outputs.version }}.metadata.json
            dist/box/ffmpeg-license-gate-${{ needs.validate.outputs.version }}.json
            dist/box/koubo-clip-ffmpeg-sources-${{ needs.validate.outputs.version }}.tar.xz
            dist/box/koubo-clip-ffmpeg-build-evidence-${{ needs.validate.outputs.version }}.json
            dist/box/koubo-clip-ffmpeg-source-lock-${{ needs.validate.outputs.version }}.json
            dist/box/koubo-clip-ffmpeg-build-recipe-${{ needs.validate.outputs.version }}.sh

  release:
    needs:
      - validate
      - box-macos-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - uses: actions/download-artifact@v4
        with:
          name: koubo-clip-${{ needs.validate.outputs.version }}-canonical-npm
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: koubo-clip-${{ needs.validate.outputs.version }}-box-macos-aarch64
          path: dist/box

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - run: bun install --frozen-lockfile

      - name: Stage and verify immutable GitHub Release assets
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
        run: |
          set -euo pipefail

          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/koubo-clip-ffmpeg-sources-${VERSION}.tar.xz"
          notes=$(printf 'GitHub artifacts: koubo-clip@%s (%s); npm registry publication is a separate explicit workflow\n\nBox managed FFmpeg corresponding source: %s\n' "$VERSION" "$NPM_TAG" "$source_url")
          assets=(
            "dist/box/koubo-clip-ffmpeg-sources-${VERSION}.tar.xz"
            "dist/box/koubo-clip-ffmpeg-source-lock-${VERSION}.json"
            "dist/box/koubo-clip-ffmpeg-build-recipe-${VERSION}.sh"
            "dist/box/koubo-clip-ffmpeg-build-evidence-${VERSION}.json"
            "dist/box/ffmpeg-license-gate-${VERSION}.json"
            "dist/koubo-clip-${VERSION}.tgz"
            "dist/koubo-clip-${VERSION}.tgz.json"
            "dist/koubo-clip-${VERSION}.tgz.acceptance.json"
            "dist/box/koubo-clip-box-skill-${VERSION}.tgz"
            "dist/box/cli-package.box.json"
            "dist/box/skill.box.json"
            "dist/box/koubo-clip-box-${VERSION}.metadata.json"
            "dist/box/koubo-clip-box-cli-${VERSION}-macos-aarch64.tgz.acceptance.json"
            "dist/box/koubo-clip-box-cli-${VERSION}-macos-aarch64.tgz"
          )

          for asset in "${assets[@]}"; do
            test -f "$asset"
          done

          remote_tag_rows=$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          remote_tag_sha=$(awk -v ref="refs/tags/${TAG}^{}" '$2 == ref { print $1 }' <<< "$remote_tag_rows")
          if [ -z "$remote_tag_sha" ]; then
            remote_tag_sha=$(awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1 }' <<< "$remote_tag_rows")
          fi
          if [ "$remote_tag_sha" != "$GITHUB_SHA" ]; then
            echo "Remote tag ${TAG} resolves to ${remote_tag_sha:-missing}, expected ${GITHUB_SHA}." >&2
            exit 1
          fi

          release_is_draft=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            release_is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            release_is_prerelease=$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')
            actual_name=$(gh release view "$TAG" --json name --jq '.name')
            actual_notes=$(gh release view "$TAG" --json body --jq '.body')
            test "$actual_name" = "koubo-clip ${VERSION}"
            test "$actual_notes" = "$notes"
            test "$release_is_prerelease" = "$PRERELEASE"
          else
            create_args=(--draft --title "koubo-clip ${VERSION}" --notes "$notes" --verify-tag)
            if [ "$PRERELEASE" = "true" ]; then
              create_args+=(--prerelease)
            fi
            gh release create "$TAG" "${create_args[@]}"
            release_is_draft=true
          fi

          verify_root="$RUNNER_TEMP/github-release-asset-verification"
          asset_manifest="$RUNNER_TEMP/github-release-assets-${VERSION}.txt"
          mkdir -p "$verify_root"
          : > "$asset_manifest"
          existing_assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"; do
            name=$(basename "$asset")
            if grep -Fqx -- "$name" <<< "$existing_assets"; then
              :
            elif [ "$release_is_draft" = "true" ]; then
              gh release upload "$TAG" "$asset"
              existing_assets=$(printf '%s\n%s\n' "$existing_assets" "$name")
            else
              echo "Published release ${TAG} is missing immutable asset ${name}." >&2
              exit 1
            fi

            expected_size=$(stat -c '%s' "$asset")
            expected_sha256=$(sha256sum "$asset" | awk '{print $1}')
            downloaded="$verify_root/$name"
            for attempt in 1 2 3 4 5; do
              rm -f "$downloaded"
              if gh release download "$TAG" --pattern "$name" --dir "$verify_root" >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "Unable to download ${name} for immutable-byte verification." >&2
                exit 1
              fi
              sleep 2
            done
            actual_size=$(stat -c '%s' "$downloaded")
            actual_sha256=$(sha256sum "$downloaded" | awk '{print $1}')
            if [ "$actual_size" != "$expected_size" ] || [ "$actual_sha256" != "$expected_sha256" ]; then
              echo "Existing release asset ${name} does not match the validated local bytes." >&2
              echo "expected size=${expected_size} sha256=${expected_sha256}" >&2
              echo "actual   size=${actual_size} sha256=${actual_sha256}" >&2
              exit 1
            fi
            printf '%s %s %s\n' "$expected_sha256" "$expected_size" "$name" >> "$asset_manifest"
          done

          expected_count=${#assets[@]}
          actual_count=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$actual_count" != "$expected_count" ]; then
            echo "Release ${TAG} has ${actual_count} assets; expected exactly ${expected_count}." >&2
            exit 1
          fi

          echo "was_draft=${release_is_draft}" >> "$GITHUB_OUTPUT"

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
        run: |
          set -euo pipefail
          verify_root="$RUNNER_TEMP/github-release-final-verification"
          asset_manifest="$RUNNER_TEMP/github-release-assets-${VERSION}.txt"
          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/koubo-clip-ffmpeg-sources-${VERSION}.tar.xz"
          expected_notes=$(printf 'GitHub artifacts: koubo-clip@%s (%s); npm registry publication is a separate explicit workflow\n\nBox managed FFmpeg corresponding source: %s\n' "$VERSION" "$NPM_TAG" "$source_url")
          mkdir -p "$verify_root"
          remote_tag_rows=$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          remote_tag_sha=$(awk -v ref="refs/tags/${TAG}^{}" '$2 == ref { print $1 }' <<< "$remote_tag_rows")
          if [ -z "$remote_tag_sha" ]; then
            remote_tag_sha=$(awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1 }' <<< "$remote_tag_rows")
          fi
          if [ "$remote_tag_sha" != "$GITHUB_SHA" ]; then
            echo "Remote tag ${TAG} changed before publication." >&2
            exit 1
          fi
          while read -r expected_sha256 expected_size name; do
            downloaded="$verify_root/$name"
            rm -f "$downloaded"
            gh release download "$TAG" --pattern "$name" --dir "$verify_root"
            actual_size=$(stat -c '%s' "$downloaded")
            actual_sha256=$(sha256sum "$downloaded" | awk '{print $1}')
            if [ "$actual_size" != "$expected_size" ] || [ "$actual_sha256" != "$expected_sha256" ]; then
              echo "Release asset ${name} changed after initial verification." >&2
              exit 1
            fi
          done < "$asset_manifest"
          expected_count=$(wc -l < "$asset_manifest" | tr -d '[:space:]')
          actual_count=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$actual_count" != "$expected_count" ]; then
            echo "Release ${TAG} asset set changed after initial verification." >&2
            exit 1
          fi
          test "$(gh release view "$TAG" --json name --jq '.name')" = "koubo-clip ${VERSION}"
          test "$(gh release view "$TAG" --json body --jq '.body')" = "$expected_notes"
          test "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" = "$PRERELEASE"
          if [ "${{ steps.github_release.outputs.was_draft }}" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "false"

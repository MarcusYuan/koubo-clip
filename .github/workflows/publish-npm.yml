name: Publish verified npm artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified GitHub Release tag to publish to npm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag input
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Require the immutable tag source on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "v$version"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@^11.5.1
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install --frozen-lockfile
      - id: meta
        name: Download and verify existing canonical release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "v$version"
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
          mkdir -p dist
          gh release download "$TAG" --pattern "koubo-clip-${version}.tgz*" --dir dist
          VERSION="$version" python3 scripts/verify-release-npm-artifact.py
          echo "EXPECTED_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          export EXPECTED_SOURCE_REVISION=$(git rev-parse HEAD)
          bun run verify:package:npm "dist/koubo-clip-${version}.tgz"
          npm_tag=latest
          case "$version" in
            *-beta.*) npm_tag=beta ;;
            *-rc.*) npm_tag=rc ;;
            *-*) echo "Unsupported prerelease version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
      - id: npm_auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
          fi

      - id: npm_status
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if npm view "koubo-clip@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm with token
        id: publish_with_token
        if: steps.npm_status.outputs.exists != 'true' && steps.npm_auth.outputs.mode == 'token'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.meta.outputs.npm_tag }}
        run: npm publish "./dist/koubo-clip-${{ steps.meta.outputs.version }}.tgz" --access public --tag "$NPM_TAG" --provenance

      - name: Publish npm with trusted publishing
        if: steps.npm_status.outputs.exists != 'true' && (steps.npm_auth.outputs.mode == 'trusted' || steps.publish_with_token.outcome == 'failure')
        env:
          NPM_TAG: ${{ steps.meta.outputs.npm_tag }}
        run: npm publish "./dist/koubo-clip-${{ steps.meta.outputs.version }}.tgz" --access public --tag "$NPM_TAG"

      - name: Verify registry-installed package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist/registry
          for attempt in {1..12}; do
            if npm pack "koubo-clip@${VERSION}" --pack-destination dist/registry --registry=https://registry.npmjs.org/; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "koubo-clip@${VERSION} was not visible from the npm registry after 12 attempts" >&2
              exit 1
            fi
            sleep 5
          done
          bun run verify:package:npm "dist/registry/koubo-clip-${VERSION}.tgz"
          node <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const version = process.env.VERSION;
          const digest = path => crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
          const canonical = digest(`dist/koubo-clip-${version}.tgz`);
          const registry = digest(`dist/registry/koubo-clip-${version}.tgz`);
          if (canonical !== registry) throw new Error(`registry tarball digest mismatch: ${canonical} != ${registry}`);
          NODE

